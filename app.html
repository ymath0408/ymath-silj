<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y-MATH 실적관리</title>
<style>
:root{
  --bg:#141821; --panel:#1b2030; --panel2:#222839; --line:#2b3246; --line2:#353d55;
  --text:#e7eaf1; --muted:#8e97ab; --dim:#677089;
  --acc:#7d9bff; --acc2:#5b7cf0; --accbg:#1f2b4a;
  --green:#3ccf91; --greenbg:#15362b; --orange:#f2a94e; --orangebg:#3a2c17; --red:#ff6f6f; --redbg:#3d1d22;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.top{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);background:#11151d;position:sticky;top:0;z-index:20}
.top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.top .lbl{color:var(--muted);font-size:13px}
.pill{background:var(--accbg);color:#c7d4ff;border:1px solid #2e3d66;border-radius:999px;padding:6px 14px;font-weight:600}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav select{background:var(--accbg);border:1px solid #2e3d66;border-radius:999px;padding:6px 12px;color:#c7d4ff;font-weight:700}
.iconbtn{background:transparent;border:1px solid var(--line2);border-radius:8px;width:32px;height:32px;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--text);border-color:var(--acc)}
.spacer{flex:1}
.savechip{font-size:12px;color:var(--muted)}
.savechip.err{color:var(--red)}
.switch{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;user-select:none}
.switch .tg{width:46px;height:24px;border-radius:999px;background:#2a3043;position:relative;cursor:pointer;border:1px solid var(--line2)}
.switch .tg::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#8e97ab;transition:.15s}
body.edit .switch .tg{background:var(--green)}
body.edit .switch .tg::after{left:24px;background:#fff}
.modechip{border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;background:#2a3043;color:var(--muted)}
body.edit .modechip{background:var(--greenbg);color:var(--green)}
.tabs{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--line);background:#11151d;overflow-x:auto}
.tab{padding:14px 16px;cursor:pointer;color:#c4cad8;font-weight:700;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-bottom-color:var(--acc)}
.tab .cnt{display:inline-block;min-width:20px;padding:1px 6px;margin-left:6px;border-radius:999px;background:var(--orangebg);color:var(--orange);font-size:12px;text-align:center}
main{padding:18px 22px 60px;max-width:1500px;margin:0 auto}
.banner{background:#1d2a47;color:#a9c0ff;border-radius:10px;padding:12px 16px;margin-bottom:16px}
.banner b{color:#d6e1ff}
.banner.warn{background:var(--orangebg);color:#ffd59e}
.banner.err{background:var(--redbg);color:#ffc2c2}
.banner.ok{background:var(--greenbg);color:#a6f0cd}
body.edit .viewonly{display:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px}
.panel>.ph{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel>.ph h2{font-size:17px;margin:0}
.panel>.ph .sub{color:var(--muted);font-size:13px}
.panel>.pb{padding:14px 18px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:9px 15px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.pri:hover{background:var(--acc)}
.btn.teal{border-color:#1f8f78;color:#4fe0bd;background:#122a27}
.btn.danger{border-color:#7a2f38;color:#ff9a9a}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:12.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.card .k{color:var(--muted);font-size:12.5px;margin-bottom:6px}
.card .v{font-size:22px;font-weight:800;letter-spacing:-.5px}
.card .d{font-size:12.5px;margin-top:4px}
.up{color:var(--green)} .down{color:var(--red)}
table.t{width:100%;border-collapse:collapse}
table.t th{color:var(--muted);font-weight:600;font-size:12.5px;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:none}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t td.c,table.t th.c{text-align:center}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#20263a}
table.t tr.tot td{background:var(--panel2);font-weight:800;border-top:1px solid var(--line2)}
.names{color:#c9cfdc;font-size:13px;line-height:1.55}
.names s{color:var(--dim)}
.badge{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11.5px;font-weight:700;margin-left:4px;vertical-align:1px}
.b-new{background:var(--accbg);color:#a9c0ff}
.b-warn{background:var(--orangebg);color:var(--orange)}
.b-red{background:var(--redbg);color:var(--red)}
.b-green{background:var(--greenbg);color:var(--green)}
.b-gray{background:#2a3043;color:var(--muted)}
input.in,select.in{background:#151926;border:1px solid var(--line2);border-radius:7px;padding:6px 8px;min-width:0}
input.in:focus,select.in:focus{outline:none;border-color:var(--acc)}
input.in:disabled,select.in:disabled{opacity:.75;background:transparent;border-color:transparent;-webkit-appearance:none;appearance:none}
input.num{text-align:right;width:110px}
.warnlist .w{display:flex;gap:14px;align-items:flex-start;padding:13px 18px;border-bottom:1px solid var(--line)}
.warnlist .w:last-child{border-bottom:none}
.warnlist .ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.ico.i-info{background:var(--accbg);color:var(--acc)}
.ico.i-warn{background:var(--orangebg);color:var(--orange)}
.ico.i-red{background:var(--redbg);color:var(--red)}
.warnlist .wt{font-weight:700;line-height:1.5}
.warnlist .ws{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.5}
.warnlist .wa{margin-left:auto;flex:none;display:flex;gap:6px;align-items:center}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.chk input{width:17px;height:17px;accent-color:var(--green)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h3{color:var(--text);font-size:19px;margin:0 0 8px}
.modal-bg{position:fixed;inset:0;background:rgba(5,8,14,.65);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;z-index:50;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal .mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-size:17px}
.modal .mb{padding:16px 20px}
.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#263052;color:#fff;padding:11px 18px;border-radius:10px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.4);font-weight:600}
.toast.err{background:#5a2730}
.loading{position:fixed;inset:0;background:rgba(5,8,14,.55);display:flex;align-items:center;justify-content:center;z-index:90}
.loading div{background:var(--panel);border:1px solid var(--line2);padding:20px 28px;border-radius:12px;font-weight:700}
.tblock{margin-bottom:18px}
.tblock .ph .tot{margin-left:auto;font-weight:800;font-size:16px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:10px 14px;align-items:center}
.help p,.help li{line-height:1.7;color:#cfd5e2}
.help h3{margin:18px 0 6px}
.scrollx{overflow-x:auto}
@media print{.top,.tabs,.noprint,.banner{display:none!important} body{background:#fff;color:#000} .panel{border-color:#ccc;background:#fff}}
</style>
</head>
<body>
<div class="top">
  <h1>Y-MATH 실적</h1>
  <span class="lbl">지점</span><span class="pill" id="branchName">남천1관</span>
  <span class="lbl">기준 월</span>
  <div class="monthnav">
    <button class="iconbtn" data-act="mprev" title="이전 달">◀</button>
    <select id="monthSel"></select>
    <button class="iconbtn" data-act="mnext" title="다음 달">▶</button>
  </div>
  <div class="spacer"></div>
  <span class="savechip" id="verChip"></span><span class="savechip" id="saveChip"></span>
  <div class="switch"><span>보기</span><div class="tg" data-act="toggleEdit" title="보기·수정 스위치"></div><span>수정</span></div>
  <span class="modechip" id="modeChip">보기 모드</span>
</div>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<div id="modalRoot"></div>
<input type="file" id="fileIn" accept=".xls,.xlsx,.html,.htm" multiple style="display:none">

<script>
"use strict";
/* =========================================================
   Y-MATH 실적관리
   - 에듀OK 재학생명부/퇴원생명부 → 강사별 반 실적 자동 계산
   - 데이터: data/silj.json (로컬 서버가 저장, 자동 백업)
   ========================================================= */
const LEVELS=['초등','중1','중2','중3','고1','고2','고3'];
const SERVER = location.protocol.startsWith('http');
let D=null;                 // 전체 데이터
let EDIT=false;             // 수정 모드
let TAB='month';
let MONTH=null;             // 'YYYY-MM'
let saveTimer=null, saving=false, dirty=false;
let classFilter='month';
let APPV=null, DATADIR=null;

/* ---------- 공통 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>(n==null||isNaN(n))?'-':Math.round(n).toLocaleString('ko-KR');
const sgn=n=>n>0?'+'+won(n):won(n);
const pad=n=>String(n).padStart(2,'0');
function ymOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function ymAdd(ym,k){let [y,m]=ym.split('-').map(Number);m+=k;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+pad(m)}
function ymLabel(ym){const [y,m]=ym.split('-');return `${y}년 ${Number(m)}월`}
function ymEnd(ym){const [y,m]=ym.split('-').map(Number);return `${ym}-${pad(new Date(y,m,0).getDate())}`}
function md(dateStr){const p=dateStr.split('-');return `${Number(p[1])}월 ${Number(p[2])}일`}
function nowStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),err?5200:2600)}
function loading(msg){let el=$('#loadingEl');if(!msg){el&&el.remove();return}if(!el){el=document.createElement('div');el.id='loadingEl';el.className='loading';document.body.appendChild(el)}el.innerHTML=`<div>${esc(msg)}</div>`}

async function api(path,opt={}){
  opt.headers=Object.assign({'X-Silj':'1'},opt.headers||{});
  const r=await fetch(path,opt);
  const ct=r.headers.get('content-type')||'';
  let body=ct.includes('json')?await r.json():await r.text();
  if(!r.ok){const e=new Error((body&&body.error)||('오류 '+r.status));e.status=r.status;e.body=body;throw e}
  return body;
}

/* ---------- 이름 규칙 ---------- */
// 에듀OK 반 이름 "고1B-2반(헌)" → 기본 이름 "고1B-2", 강사 글자 "헌"
function baseName(c){return String(c||'').replace(/\s*\([^()]*\)\s*$/,'').replace(/\s+/g,'').replace(/반$/,'').trim()}
function codeOf(c){const m=String(c||'').match(/\(([^()]*)\)\s*$/);return m?m[1].trim():''}
function teacherByName(n){return D.teachers.find(t=>t.name===n)}
function teacherByCode(c){return c?D.teachers.find(t=>t.code&&t.code===c):null}
function teacherByLabel(l){return D.teachers.find(t=>t.label===l)}
function labelOf(name){const t=teacherByName(name);return t?(t.label||name):name}
function guessLevel(base,grades){
  let m;
  if((m=base.match(/^예비(고|중)([1-3])/)))return m[1]+m[2];
  if((m=base.match(/^(중|고)([1-3])/)))return m[1]+m[2];
  if(/^초/.test(base))return '초등';
  if(/^(미적|확통|기하|대수|수1|수2|수학Ⅰ|수학Ⅱ)/.test(base))return '고2';
  const cnt={};(grades||[]).forEach(g=>{let l=/^초/.test(g)?'초등':g; if(LEVELS.includes(l))cnt[l]=(cnt[l]||0)+1});
  const best=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  return best?best[0]:'고1';
}

/* ---------- 데이터 기본값 ---------- */
function defaults(d){
  d=d||{};
  if(typeof d.rev!=='number')d.rev=0;
  d.app='ymath-silj';d.ver=1;
  d.branch=d.branch||'남천1관';
  d.rates=d.rates||{'2':{'초등':60000,'중1':60000,'중2':70000,'중3':80000,'고1':90000,'고2':100000,'고3':110000},'1':{'초등':120000,'중1':120000,'중2':140000,'중3':160000,'고1':180000,'고2':200000,'고3':220000}};
  d.presets=d.presets||[{label:'주 1회 수업(+반)',price:50000}];
  d.teachers=d.teachers||[];
  d.classes=d.classes||{};
  d.months=d.months||{};
  return d;
}

/* ---------- 저장 ---------- */
function markDirty(){dirty=true;setSaveChip('저장 대기…');clearTimeout(saveTimer);saveTimer=setTimeout(save,700)}
function setSaveChip(t,err){const c=$('#saveChip');c.textContent=t;c.className='savechip'+(err?' err':'')}
async function save(){
  if(saving){clearTimeout(saveTimer);saveTimer=setTimeout(save,400);return}
  if(!dirty)return;
  saving=true;dirty=false;setSaveChip('저장 중…');
  const out=Object.assign({rev:D.rev+1},D);out.rev=D.rev+1;
  try{
    if(SERVER){
      await api('/api/data',{method:'POST',headers:{'Content-Type':'application/json','X-Base-Rev':String(D.rev)},body:JSON.stringify(out)});
    }else{
      localStorage.setItem('ymath-silj',JSON.stringify(out));
    }
    D.rev=out.rev;setSaveChip('저장됨 '+nowStr().slice(11));
  }catch(e){
    if(e.status===409){alert(e.message);await load();render();}
    else{dirty=true;setSaveChip('저장 실패 — '+e.message,true);toast('저장하지 못했어요: '+e.message,true)}
  }finally{saving=false}
}
async function load(){
  if(SERVER){D=defaults(await api('/api/data'))}
  else{let s=null;try{s=localStorage.getItem('ymath-silj')}catch(e){}D=defaults(s?JSON.parse(s):null)}
}

/* =========================================================
   에듀OK 명부 읽기 (HTML 형식 .xls)
   ========================================================= */
function leafRows(html){
  const dp=new DOMParser().parseFromString(html,'text/html');
  return [...dp.querySelectorAll('tr')].filter(tr=>!tr.querySelector('table')).map(tr=>[...tr.children].map(c=>c.textContent.replace(/\s+/g,' ').trim()));
}
function snapTime(html){
  const m=html.replace(/<[^>]+>/g,' ').match(/기준시각\s*:\s*(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일([^\d]*)(\d{1,2}):(\d{2})/);
  if(!m)return null;
  let h=Number(m[5]);const pm=/오후/.test(m[4]),am=/오전/.test(m[4]);if(pm&&h<12)h+=12;if(am&&h===12)h=0;
  return `${m[1]}-${pad(m[2])}-${pad(m[3])} ${pad(h)}:${m[6]}`;
}
const normDate=s=>{const m=String(s||'').match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);return m?`${m[1]}-${pad(m[2])}-${pad(m[3])}`:''};
function parseStudents(html){
  const rows=leafRows(html);
  const hi=rows.findIndex(r=>r.includes('입학일')&&r.includes('반'));
  if(hi<0)throw new Error('재학생명부 형식이 아니에요.');
  const H=rows[hi], ix=n=>H.indexOf(n);
  const cBan=ix('반'), nCls=H.length-cBan;
  const iN=ix('학생'),iS=ix('학교'),iG=ix('학년'),iIn=ix('입학일');
  const cls={ban:0,teacher:ix('담임')-cBan,memo:ix('메모')-cBan};
  const out=[];let cur=null;
  for(const r of rows.slice(hi+1)){
    let cpart=null;
    if(r.length===H.length&&r[iN]){
      cur={n:r[iN],sc:r[iS]||'',g:r[iG]||'',in:normDate(r[iIn]),memo:'',cls:[]};out.push(cur);
      cpart=r.slice(cBan);
    }else if(r.length===nCls&&cur){cpart=r}
    if(!cpart||!cur)continue;
    const c=cpart[cls.ban];
    if(cls.memo>=0&&cpart[cls.memo]&&!cur.memo)cur.memo=cpart[cls.memo].slice(0,200);
    if(c)cur.cls.push({c,t:cls.teacher>=0?(cpart[cls.teacher]||''):''});
  }
  return out;
}
function parseOuts(html){
  const rows=leafRows(html);
  const hi=rows.findIndex(r=>r.includes('퇴원일')&&r.includes('이름'));
  if(hi<0)throw new Error('퇴원생명부 형식이 아니에요.');
  const H=rows[hi],ix=n=>H.indexOf(n);
  const iN=ix('이름'),iS=ix('학교'),iG=ix('학년'),iL=ix('마지막 수강반'),iIn=ix('입학일'),iO=ix('퇴원일'),iW=ix('사유'),iM=ix('내용');
  return rows.slice(hi+1).filter(r=>r.length>=H.length-2&&r[iN]&&normDate(r[iO])).map(r=>({
    n:r[iN],sc:r[iS]||'',g:r[iG]||'',last:r[iL]||'',in:normDate(r[iIn]),out:normDate(r[iO]),why:(r[iW]||'').slice(0,60),memo:(r[iM]||'').slice(0,200)}));
}
function splitClasses(s){return String(s||'').split(/\s*[,\/]\s*|\s{2,}/).map(x=>x.trim()).filter(Boolean)}

/* 명부를 이 달에 적용 */
function applySnapshot(ym,students,outs,at,src){
  const m=D.months[ym]&&D.months[ym].kind==='live'?D.months[ym]:{kind:'live',closed:false,inc:{}};
  m.kind='live';m.inc=m.inc||{};
  const lo=ymAdd(ym,-1)+'-01';
  m.snap={at:at||nowStr(),src:src||'eok',students,outs:(outs||[]).filter(o=>o.out>=lo)};
  delete m.rows;
  D.months[ym]=m;
  // 처음 보는 강사 등록
  for(const s of students)for(const c of s.cls){
    if(c.t&&!teacherByName(c.t)){
      const code=codeOf(c.c);
      D.teachers.push({id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:c.t,code:teacherByCode(code)?'':code,label:c.t.slice(1)+'T',order:D.teachers.length+1,active:true});
    }else if(c.t){const t=teacherByName(c.t);const code=codeOf(c.c);if(t&&!t.code&&code&&!teacherByCode(code))t.code=code}
  }
  // 처음 보는 반은 단가 설정을 임시로 만들어 둠
  const calc=computeMonth(ym);
  for(const r of calc.rows){
    if(!D.classes[r.skey])D.classes[r.skey]={level:r.level,struct:'2',exc:null,note:'',auto:true};
  }
}

/* =========================================================
   계산
   ========================================================= */
function settingsFor(skey,base,grades){
  const s=D.classes[skey];
  if(s)return s;
  return {level:guessLevel(base,grades),struct:'2',exc:null,note:'',auto:true,missing:true};
}
function unitOf(s){
  if(s.exc!=null&&s.exc!==''&&!isNaN(s.exc))return Number(s.exc);
  const tb=D.rates[s.struct||'2']||{};return Number(tb[s.level]||0);
}
function prevMonthKey(ym){return Object.keys(D.months).filter(k=>k<ym).sort().pop()||null}
function rowsOfMonth(ym){
  const m=D.months[ym];if(!m)return null;
  if(m.kind==='history'||m.closed)return m.rows||[];
  return computeMonth(ym,true).rows.map(r=>({t:r.label,c:r.base,n:r.n,names:r.names,unit:r.unit,amt:r.amt}));
}
function computeMonth(ym,noPrev){
  const m=D.months[ym];
  const res={rows:[],warns:[],byLabel:{},total:{n:0,amt:0,dAmt:0,dN:0},hasPrev:false,frozen:false};
  if(!m)return res;
  if(m.kind==='history'||m.closed){
    res.frozen=true;
    res.rows=(m.rows||[]).map(r=>Object.assign({label:r.t,base:r.c,frozen:true},r));
  }else if(m.snap){
    const end=ymEnd(ym),start=ym+'-01';
    const groups=new Map();
    const add=(tname,eok,mem)=>{
      const base=baseName(eok);const skey=tname+'|'+base;
      if(!groups.has(skey))groups.set(skey,{skey,tname,base,eok:new Set(),mem:[]});
      const g=groups.get(skey);g.eok.add(eok);
      if(!g.mem.some(x=>x.key===mem.key))g.mem.push(mem);
    };
    for(const s of m.snap.students){
      const key=s.n+'|'+s.sc;
      for(const c of s.cls){
        let tname=c.t;if(!tname){const code=codeOf(c.c);if(!code)continue; // 예: '미수업출석' 같은 강사 없는 반은 건너뜀
          const t=teacherByCode(code);tname=t?t.name:'(강사 미지정)'}
        const after=s.in&&s.in>end;
        add(tname,c.c,{key,n:s.n,sc:s.sc,g:s.g,in:s.in,memo:s.memo,src:'in',def:!after,flag:after?'after-in':(s.in>=start&&s.in<=end?'new':'')});
      }
    }
    for(const o of m.snap.outs||[]){
      if(o.out<start)continue;
      const key=o.n+'|'+o.sc;
      const leftIn=o.out<=end;
      for(const c of splitClasses(o.last)){
        const t=teacherByCode(codeOf(c));if(!t)continue;
        add(t.name,c,{key,n:o.n,sc:o.sc,g:o.g,in:o.in,out:o.out,why:o.why,memo:o.memo,src:'out',def:!leftIn,flag:leftIn?'left':'after-out'});
      }
    }
    for(const g of groups.values()){
      const st=settingsFor(g.skey,g.base,g.mem.map(x=>x.g));
      const unit=unitOf(st);
      for(const x of g.mem){const ov=(m.inc||{})[x.key+'@'+g.skey];x.inc=ov===undefined?x.def:!!ov;x.ov=ov!==undefined}
      const incl=g.mem.filter(x=>x.inc);
      res.rows.push({skey:g.skey,tname:g.tname,label:labelOf(g.tname),base:g.base,eok:[...g.eok],mem:g.mem,
        n:incl.length,names:incl.map(x=>x.n),excluded:g.mem.filter(x=>!x.inc).map(x=>x.n),
        level:st.level,struct:st.struct||'2',exc:st.exc,unit,amt:unit*incl.length,auto:!!st.auto,missing:!!st.missing,note:st.note||''});
    }
  }
  // 정렬: 강사 순서 → 반 이름
  const ord=l=>{const t=teacherByLabel(l)||teacherByName(l);return t?(t.order||99):999};
  const lvlOrd=b=>{const g=guessLevel(b,[]);return LEVELS.indexOf(g)};
  res.rows.sort((a,b)=>ord(a.label)-ord(b.label)||a.label.localeCompare(b.label,'ko')||(/^예비/.test(b.base)-/^예비/.test(a.base))||lvlOrd(a.base)-lvlOrd(b.base)||a.base.localeCompare(b.base,'ko',{numeric:true}));
  // 전월 비교
  const pk=noPrev?null:prevMonthKey(ym);
  let prevMap=new Map();
  if(pk){res.hasPrev=true;res.prevKey=pk;for(const r of rowsOfMonth(pk)||[])prevMap.set(r.t+'|'+r.c,r)}
  for(const r of res.rows){
    const p=prevMap.get(r.label+'|'+r.base);
    r.prev=p||null;
    if(pk){r.dAmt=r.amt-(p?p.amt:0);r.dN=r.n-(p?p.n:0)}
    const L=res.byLabel[r.label]||(res.byLabel[r.label]={label:r.label,n:0,amt:0,dAmt:0,dN:0,rows:0,prevAmt:0});
    L.n+=r.n;L.amt+=r.amt;L.dAmt+=(r.dAmt||0);L.dN+=(r.dN||0);L.rows++;
    res.total.n+=r.n;res.total.amt+=r.amt;res.total.dAmt+=(r.dAmt||0);res.total.dN+=(r.dN||0);
  }
  // 전월엔 있었는데 이번 달엔 없는 반
  res.gone=[];
  if(pk){for(const [k,p] of prevMap){if(!res.rows.some(r=>r.label+'|'+r.base===k)&&p.n>0){res.gone.push(p);
    const L=res.byLabel[p.t]||(res.byLabel[p.t]={label:p.t,n:0,amt:0,dAmt:0,dN:0,rows:0});L.dAmt-=p.amt;L.dN-=p.n;res.total.dAmt-=p.amt;res.total.dN-=p.n}}}
  for(const L of Object.values(res.byLabel))L.prevAmt=L.amt-L.dAmt;
  if(!res.frozen&&m.snap&&!noPrev)res.warns=buildWarnings(ym,m,res,prevMap);
  return res;
}

/* ---------- 확인 필요 목록 ---------- */
function buildWarnings(ym,m,res,prevMap){
  const W=[];const end=ymEnd(ym);const mm=Number(ym.slice(5));
  const at=m.snap.at||'';
  if(at&&at.slice(0,10)<end)W.push({kind:'timing',lv:'warn',t:`말일 전에 받은 명단이에요 (${at} 기준)`,s:`실적은 ${md(end)} 기준이에요. 말일에 [에듀OK에서 받기]를 한 번 더 눌러 주세요.`});
  if(at&&at.slice(0,10)>end)W.push({kind:'timing',lv:'info',t:`말일이 지난 뒤 받은 명단이에요 (${at} 기준)`,s:`${mm}월 말일 뒤에 입학한 학생은 빼고, 말일 뒤에 퇴원한 학생은 넣어서 계산했어요. 그 사이 반을 옮긴 학생은 직접 확인해 주세요.`});
  // 학생별 모으기
  const byStu=new Map();
  for(const r of res.rows)for(const x of r.mem){
    if(!byStu.has(x.key))byStu.set(x.key,{x,rows:[]});
    byStu.get(x.key).rows.push(r);
  }
  const clsTxt=rows=>rows.map(r=>`${r.base}(${r.label})`).join(', ');
  for(const {x,rows} of byStu.values()){
    const keys=rows.map(r=>x.key+'@'+r.skey);
    const incNow=rows.every(r=>r.mem.find(y=>y.key===x.key).inc);
    const memo=x.memo?` · 메모: ${x.memo}`:'';
    if(x.flag==='new')W.push({kind:'new',lv:'info',t:`${x.n} 학생은 ${md(x.in)}부 수강했어요`,s:`신규 입학 · ${clsTxt(rows)}${memo}`,keys,inc:incNow,def:true});
    if(x.flag==='after-in')W.push({kind:'after',lv:'warn',t:`${x.n} 학생은 ${md(x.in)} 입학이라 ${mm}월 말일엔 없었어요`,s:`그래서 실적에서 뺐어요 · ${clsTxt(rows)}${memo}`,keys,inc:incNow,def:false});
    if(x.flag==='left')W.push({kind:'left',lv:'red',t:`${x.n} 학생은 ${md(x.out)} 퇴원했어요`,s:`말일 기준이라 실적에서 빠져 있어요 · 마지막 반 ${clsTxt(rows)}${x.why?' · 사유: '+x.why:''}${memo}`,keys,inc:incNow,def:false});
    if(x.flag==='after-out')W.push({kind:'after',lv:'warn',t:`${x.n} 학생은 ${md(x.out)} 퇴원했지만 ${mm}월 말일엔 다니고 있었어요`,s:`그래서 실적에 넣었어요 · ${clsTxt(rows)}${memo}`,keys,inc:incNow,def:true});
  }
  // 반 이동 (전월 명단과 비교)
  if(res.hasPrev){
    for(const r of res.rows){
      const p=r.prev;if(!p)continue;
      const prevNames=new Set(p.names||[]);
      for(const x of r.mem){
        if(x.src!=='in'||x.flag)continue;
        if(!prevNames.has(x.n))W.push({kind:'join',lv:'info',t:`${x.n} 학생이 이번 달 ${r.base}(${r.label})에 새로 들어왔어요`,s:`지난달 명단엔 없었어요${x.memo?' · 메모: '+x.memo:''}`,keys:[x.key+'@'+r.skey],inc:x.inc,def:true});
      }
      const now=new Set(r.mem.map(x=>x.n));
      for(const n of prevNames){if(!now.has(n))W.push({kind:'drop',lv:'warn',t:`${n} 학생이 ${r.base}(${r.label})에서 빠졌어요`,s:'지난달엔 있었어요. 반 이동이나 퇴원인지 확인해 주세요.'})}
    }
    for(const p of res.gone)W.push({kind:'gone',lv:'warn',t:`${p.c}(${p.t}) 반이 이번 달엔 없어요`,s:`지난달 ${p.n}명 · ${won(p.amt)}원`});
    for(const r of res.rows)if(!r.prev&&r.n>0)W.push({kind:'newcls',lv:'info',t:`${r.base}(${r.label})는 이번 달 새로 생긴 반이에요`,s:`${r.n}명 · ${won(r.amt)}원`});
  }
  // 단가 확인이 필요한 반
  for(const r of res.rows)if(r.auto)W.push({kind:'rate',lv:'warn',t:`${r.base}(${r.label}) 단가를 확인해 주세요`,s:`처음 보는 반이라 ${r.struct}인구조 ${r.level} 단가(${won(r.unit)}원)로 임시 계산했어요. [반 관리]에서 확인하면 이 알림이 사라져요.`,skey:r.skey});
  for(const r of res.rows)if(r.tname==='(강사 미지정)')W.push({kind:'teacher',lv:'red',t:`${r.base} 반의 담당 강사를 알 수 없어요`,s:`에듀OK 반 이름: ${r.eok.join(', ')} · [강사 관리]에서 반 이름 괄호 글자를 맞춰 주세요.`});
  const order={timing:0,left:1,after:2,new:3,rate:4,teacher:5,join:6,drop:7,newcls:8,gone:9};
  W.sort((a,b)=>order[a.kind]-order[b.kind]);
  return W;
}

   화면

const TABS=[['month','월 실적'],['warn','확인 필요'],['classes','반 관리'],['rates','단가표'],['teachers','강사 관리'],['history','지난 실적'],['settings','설정'],['help','? 도움말']];
function render(){
  document.body.classList.toggle('edit',EDIT);

  $('#branchName').textContent=D.branch;

  $('#tabs').innerHTML=TABS.map(([k,l])=>`<div class="tab ${TAB===k?'on':''}" data-act="tab" data-k="${k}">${l}${k==='warn'&&wc?`<span class="cnt">${wc}</span>`:''}</div>`).join('');
  const viewBanner=`<div class="banner viewonly">보기 모드예요. 고치려면 위쪽 <b>보기·수정 스위치</b>를 켜세요 (들어갈 때 자동 백업).</div>`;

  let h='';
  if(TAB==='month')h=viewMonth(calc);
  else if(TAB==='warn')h=viewWarn(calc);

function renderMonthSel(){

  // 요약 카드

    <div class="card"><div class="k">${ymLabel(MONTH)} 전체 실적</div><div class="v">${won(T.amt)}원</div>${calc.hasPrev?`<div class="d ${T.dAmt>=0?'up':'down'}">전월 대비 ${sgn(T.dAmt)}원</div>`:''}</div>
    <div class="card"><div class="k">총 인원 (강사별 합)</div><div class="v">${T.n}명</div>${calc.hasPrev?`<div class="d ${T.dN>=0?'up':'down'}">전월 대비 ${T.dN>0?'+':''}${T.dN}명</div>`:''}</div>
    ${Object.values(calc.byLabel).filter(L=>L.rows).map(L=>`<div class="card"><div class="k">${esc(L.label)} · ${L.rows}개 반 · ${L.n}명</div><div class="v">${won(L.amt)}원</div>${calc.hasPrev?`<div class="d ${L.dAmt>=0?'up':'down'}">전월 대비 ${sgn(L.dAmt)}원</div>`:''}</div>`).join('')}
  </div>`;

        <td class="small muted">${r.frozen?'-':(r.exc!=null&&r.exc!==''?`예외${r.note?' · '+esc(r.note):''}`:`${r.struct}인 · ${r.level}`)}</td>
        <td class="num">${won(r.unit)}</td>
        <td class="num"><b>${r.n}</b></td>
        <td class="names">${esc((r.names||[]).join(', '))}${(r.excluded||[]).length?` <s>${esc(r.excluded.join(', '))}</s> <span class="badge b-gray">제외 ${r.excluded.length}</span>`:''}</td>

      </tr>`).join('')}
      <tr class="tot"><td></td><td>합계</td><td></td><td></td><td class="num">${L.n}</td><td></td><td class="num">${won(L.amt)}</td>${calc.hasPrev?`<td class="num">${sgn(L.dAmt)}</td><td class="num">${L.dN>0?'+':''}${L.dN}</td>`:''}</tr>
    </table></div></div>`;
  }
  if(calc.gone&&calc.gone.length)h+=`<div class="panel"><div class="ph"><h2>지난달엔 있었는데 이번 달엔 없는 반</h2></div><div class="pb">${calc.gone.map(p=>`<div class="small" style="padding:3px 0">${esc(p.t)} · <b>${esc(p.c)}</b> · 지난달 ${p.n}명 ${won(p.amt)}원</div>`).join('')}</div></div>`;
  return h;
}

/* ---------- 확인 필요 ---------- */
function viewWarn(calc){
  const m=D.months[MONTH];
  if(!m||m.kind!=='live'||!m.snap)return `<div class="panel"><div class="empty"><h3>확인할 것이 없어요</h3><p>${m&&m.kind==='history'?'예전 엑셀에서 옮겨온 달이에요.':'이 달 명부를 아직 받지 않았어요.'}</p></div></div>`;
  if(m.closed)return `<div class="panel"><div class="empty"><h3>마감된 달이에요</h3><p>고치려면 [월 실적]에서 마감을 풀어 주세요.</p></div></div>`;
  const ws=calc.warns;
  const ico={info:'i',warn:'!',red:'!'};
  const group=(title,sub,list)=>list.length?`<div class="panel"><div class="ph"><h2>${title}</h2><span class="sub">${sub}</span></div><div class="warnlist">${list.map(w=>`<div class="w">
      <div class="ico i-${w.lv==='red'?'red':w.lv==='warn'?'warn':'info'}">${ico[w.lv]||'i'}</div>
      <div><div class="wt">${esc(w.t)}</div><div class="ws">${esc(w.s||'')}</div></div>
      <div class="wa">${w.keys?`<label class="chk"><input type="checkbox" class="in" data-act="incToggle" data-keys="${esc(JSON.stringify(w.keys))}" ${w.inc?'checked':''}> 실적에 포함</label>${w.inc!==w.def?'<span class="badge b-warn">직접 바꿈</span>':''}`:''}${w.skey?`<button class="btn sm" data-act="gotoClass" data-k="${esc(w.skey)}">단가 보기</button>`:''}</div>
    </div>`).join('')}</div></div>`:'';
  let h=`<div class="banner">실적은 <b>${md(ymEnd(MONTH))} 말일 기준</b>으로 계산해요. 월중에 들어오거나 나간 학생은 아래에서 원장님 판단대로 <b>실적에 포함</b>을 켜고 끄세요.${EDIT?'':' (수정 모드에서 바꿀 수 있어요)'}</div>`;
  h+=group('먼저 확인할 것','명부 기준 시각 · 퇴원 · 말일 전후',ws.filter(w=>['timing','left','after','teacher'].includes(w.kind)));
  h+=group('이번 달 신규 입학','입학일이 이번 달인 학생',ws.filter(w=>w.kind==='new'));
  h+=group('단가 확인','처음 보는 반',ws.filter(w=>w.kind==='rate'));
  h+=group('지난달과 달라진 반 구성','반 이동 · 새 반 · 없어진 반',ws.filter(w=>['join','drop','newcls','gone'].includes(w.kind)));
  if(!ws.length)h+=`<div class="panel"><div class="empty"><h3>확인할 것이 없어요</h3></div></div>`;
  return h;
}

async function eokFetch(){
  const m=D.months[MONTH];
  if(m&&m.closed){toast('마감된 달이에요. 먼저 마감을 풀어 주세요.',true);return}
  if(m&&m.kind==='history'&&!confirm(`${ymLabel(MONTH)}는 예전 엑셀에서 옮겨온 달이에요. 에듀OK 명부로 새로 계산할까요?`))return;
  if(m&&m.kind==='live'&&m.snap&&!confirm(`${ymLabel(MONTH)} 명부를 이미 받았어요 (${m.snap.at}). 새로 받아서 바꿀까요?\n(학생별로 직접 바꾼 포함/제외는 그대로 남아요)`))return;
  try{
    loading('에듀OK에 로그인하는 중…');
    await api('/api/eok/login',{method:'POST'});
    loading('재학생명부 받는 중…');
    const inHtml=await api('/api/eok/students',{method:'POST'});
    loading('퇴원생명부 받는 중…');
    let outHtml='';try{outHtml=await api('/api/eok/outs',{method:'POST'})}catch(e){toast('퇴원생명부는 받지 못했어요: '+e.message,true)}
    const students=parseStudents(inHtml);
    const outs=outHtml?parseOuts(outHtml):[];
    applySnapshot(MONTH,students,outs,snapTime(inHtml)||nowStr(),'eok');
    markDirty();loading();render();
    toast(`받았어요: 재원 ${students.length}명${outs.length?' · 퇴원생명부 '+outs.length+'명':''}`);
  }catch(e){loading();toast(e.message,true);if(/저장|비밀번호|로그인/.test(e.message)){TAB='settings';render()}}
}
async function fileImport(files){
  let students=null,outs=null,at=null;
  for(const f of files){
    const buf=await f.arrayBuffer();
    let txt=new TextDecoder('euc-kr').decode(buf);
    if(!/명부/.test(txt))txt=new TextDecoder('utf-8').decode(buf);
    if(/재학생명부/.test(txt)){students=parseStudents(txt);at=snapTime(txt)}
    else if(/퇴원생명부/.test(txt)){outs=parseOuts(txt)}
    else{toast(f.name+': 에듀OK 재학생명부/퇴원생명부 파일이 아니에요.',true)}
  }
  if(!students){if(outs)toast('재학생명부 파일도 같이 골라 주세요.',true);return}
  const m=D.months[MONTH];
  if(m&&m.kind==='live'&&m.snap&&!confirm(`${ymLabel(MONTH)} 명부를 새 파일로 바꿀까요?`))return;
  if(!outs&&m&&m.snap&&m.snap.outs)outs=m.snap.outs;
  applySnapshot(MONTH,students,outs||[],at||nowStr(),'file');markDirty();render();
  toast(`불러왔어요: 재원 ${students.length}명${outs?' · 퇴원 '+outs.length+'명':' (퇴원생명부 없음)'}`);
}

function exportXlsx(){

  const H=s=>({v:s,s:1}),T=s=>({v:s,s:2}),N=n=>({v:Number(n)||0,s:3}),C=s=>({v:s,s:8}),W=s=>({v:s,s:7});

  rows.push([{v:m&&m.kind==='history'?'예전 엑셀 실적표에서 옮겨온 값':(m&&m.snap?`기준: 에듀OK 명부 ${m.snap.at} · 말일 기준 재원생 · ${m.closed?'마감 '+(m.closedAt||''):'작성 중'}`:''),s:9}]);
  rows.push(null);
  rows.push(['','',H('학년'),H('2인구조'),H('1인구조'),'',H('예외 단가')]);
  LEVELS.forEach((l,i)=>{const p=D.presets[i];rows.push(['','',{v:l,s:4},N(D.rates['2'][l]),N(D.rates['1'][l]),'',p?T(`${p.label} ${won(p.price)}원`):''])});
  rows.push(null);

  const totRefs=[];
  for(const lb of labels){
    const rs=calc.rows.filter(r=>r.label===lb);
    rows.push({h:22,cells:hdr.map(H)});
    const first=rows.length+1;
    rs.forEach((r,i)=>{
      const rn=rows.length+1;

      const note=[(r.excluded&&r.excluded.length)?'제외: '+r.excluded.join(', '):'',r.auto?'단가 확인 필요':'',P&&!r.prev&&!r.frozen?'새 반':''].filter(Boolean).join(' / ');
      rows.push([i===0?{v:lb,s:8}:{v:'',s:8},C(i+1),T(r.base),W(basis),N(r.unit),{v:r.n,s:8},W((r.names||[]).join(', ')),{f:`E${rn}*F${rn}`,v:r.amt,s:3},...(P?[{v:r.dAmt||0,s:10},{v:r.dN||0,s:10}]:[]),W(note)]);
    });
    const last=rows.length;const tr=rows.length+1;totRefs.push(tr);
    const L=calc.byLabel[lb];
    rows.push([{v:'',s:4},{v:'',s:4},{v:'합계',s:4},{v:'',s:4},{v:'',s:4},{f:`SUM(F${first}:F${last})`,v:L.n,s:5},{v:'',s:4},{f:`SUM(H${first}:H${last})`,v:L.amt,s:5},...(P?[{f:`SUM(I${first}:I${last})`,v:L.dAmt,s:11},{f:`SUM(J${first}:J${last})`,v:L.dN,s:11}]:[]),{v:'',s:4}]);
    rows.push(null);
  }
  rows.push([{v:'전체 합계',s:4},{v:'',s:4},{v:'',s:4},{v:'',s:4},{v:'',s:4},{f:totRefs.map(r=>'F'+r).join('+')||'0',v:calc.total.n,s:5},{v:'',s:4},{f:totRefs.map(r=>'H'+r).join('+')||'0',v:calc.total.amt,s:5},...(P?[{v:calc.total.dAmt,s:11},{v:calc.total.dN,s:11}]:[]),{v:'',s:4}]);
  const sheets=[{name:`${ymLabel(MONTH).replace(/\s/g,'')} 실적`,cols:[10,6,14,20,11,8,46,13,...(P?[14,12]:[]),26],rows,merges}];
  // 요약
  const srows=[{h:26,cells:[{v:`${ymLabel(MONTH)} 강사별 요약`,s:6}]},null,{h:22,cells:['강사','반 수','인원','금액',...(P?['전월 금액','전월 대비']:[])].map(H)}];
  for(const L of Object.values(calc.byLabel))srows.push([T(L.label),{v:L.rows,s:8},{v:L.n,s:8},N(L.amt),...(P?[N(L.prevAmt),{v:L.dAmt,s:10}]:[])]);

}

   이벤트
   ========================================================= */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,k=el.dataset.k;
  if(el.tagName==='INPUT'||el.tagName==='SELECT')return; // change 이벤트에서 처리
  if(act==='modalBg'&&e.target!==el)return;
  switch(act){
    case 'tab':e.preventDefault();TAB=k;render();break;
    case 'mprev':MONTH=ymAdd(MONTH,-1);render();break;
    case 'mnext':MONTH=ymAdd(MONTH,1);render();break;
    case 'gotoMonth':MONTH=k;TAB='month';render();break;
    case 'toggleEdit':
      if(!EDIT){if(SERVER){try{await api('/api/backup?reason='+encodeURIComponent('수정전'),{method:'POST'})}catch(err){toast('백업 실패: '+err.message,true)}}EDIT=true;toast('수정 모드 · 백업했어요')}
      else{EDIT=false;await save()}
      render();break;
    case 'eokFetch':eokFetch();break;
    case 'fileOpen':$('#fileIn').click();break;
    case 'exportXlsx':exportXlsx();break;
    case 'close':{const m=D.months[MONTH];const calc=computeMonth(MONTH);
      const left=calc.warns.filter(w=>w.kind==='rate').length;
      if(left&&!confirm(`단가 확인이 안 된 반이 ${left}개 있어요. 그래도 마감할까요?`))return;
      if(!confirm(`${ymLabel(MONTH)} 실적을 마감할까요?\n마감하면 단가를 바꿔도 이 달 금액은 그대로예요.`))return;
      m.rows=calc.rows.map(r=>({t:r.label,c:r.base,n:r.n,names:r.names,unit:r.unit,amt:r.amt,basis:r.exc!=null&&r.exc!==''?'예외':`${r.struct}인·${r.level}`}));
      m.closed=true;m.closedAt=nowStr();markDirty();render();toast('마감했어요');break;}
    case 'unclose':{const m=D.months[MONTH];if(!confirm('마감을 풀까요? 지금 단가표로 다시 계산돼요.'))return;m.closed=false;delete m.rows;delete m.closedAt;markDirty();render();break;}
    case 'openRow':openRow(k);break;
    case 'modalBg':case 'modalClose':closeModal();render();break;
    case 'gotoClass':TAB='classes';render();setTimeout(()=>{const r=document.getElementById('cls-'+k);if(r){r.scrollIntoView({block:'center'});r.style.outline='2px solid var(--acc)'}},50);break;
    case 'clsOk':D.classes[k].auto=false;markDirty();render();break;
    case 'clsDel':if(confirm('이 반 설정을 지울까요?')){delete D.classes[k];markDirty();render()}break;
    case 'presetAdd':D.presets.push({label:'새 예외',price:0});markDirty();render();break;
    case 'presetDel':D.presets.splice(Number(el.dataset.i),1);markDirty();render();break;
    case 'tAdd':D.teachers.push({id:'t'+Date.now().toString(36),name:'새 강사',code:'',label:'',order:D.teachers.length+1,active:true});markDirty();render();break;
    case 'credSave':{const id=$('#eokId').value.trim(),pw=$('#eokPw').value;if(!id||!pw){toast('아이디와 비밀번호를 넣어 주세요.',true);return}
      try{await api('/api/cred',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,pw})});$('#eokPw').value='';toast('저장했어요');loadSettingsAsync()}catch(err){toast(err.message,true)}break;}
    case 'credTest':try{loading('에듀OK 로그인 시험 중…');await api('/api/eok/login',{method:'POST'});loading();toast('에듀OK에 로그인됐어요')}catch(err){loading();toast(err.message,true)}break;
    case 'backupNow':try{const b=await api('/api/backup?reason='+encodeURIComponent('수동'),{method:'POST'});toast('백업했어요: '+b.name);loadSettingsAsync()}catch(err){toast(err.message,true)}break;
    case 'restore':{if(!confirm(k+' 백업으로 되돌릴까요? 지금 상태도 먼저 백업해 둬요.'))return;
      try{const data=await api('/api/restore?name='+encodeURIComponent(k),{method:'POST'});const rev=D.rev;D=defaults(data);D.rev=rev;dirty=true;await save();render();toast('복원했어요')}catch(err){toast(err.message,true)}break;}
    case 'dataDirSet':{const dir=$('#dataDirIn').value.trim();if(!dir){toast('폴더 경로를 넣어 주세요.',true);return}
      if(!confirm(`실적 데이터 폴더를 바꿀까요?\n${dir}`))return;
      try{await save();const r=await api('/api/datadir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dir})});
        await load();render();toast(r.mode==='copied'?'지금 데이터를 새 폴더로 복사했어요':'새 폴더의 데이터를 불러왔어요')}catch(err){toast(err.message,true)}break;}
    case 'updCheck':try{const u=await api('/api/update/check');
      $('#updState').innerHTML=u.newer?`<span class="badge b-new">새 버전 v${esc(u.latest)}</span> ${esc((u.notes||[]).join(' · '))} <button class="btn sm pri" data-act="updApply">지금 설치</button>`:`<span class="badge b-green">최신</span> v${esc(u.current)}이 최신 버전이에요.`}catch(err){toast(err.message,true)}break;
    case 'updApply':if(!confirm('새 버전을 설치하고 프로그램을 다시 켤까요? (몇 초 걸려요)'))return;
      try{await save();loading('업데이트 설치 중…');const r=await api('/api/update/apply',{method:'POST'});if(r.same){loading();toast('이미 최신 버전이에요');return}waitRestart('v'+r.to+' 설치 완료 · 다시 켜는 중…')}catch(err){loading();toast(err.message,true)}break;
    case 'rollback':if(!confirm(k+'(으)로 되돌릴까요? 다음 새 버전이 나올 때까지 자동 업데이트를 하지 않아요.'))return;
      try{await save();await api('/api/update/rollback?v='+encodeURIComponent(k),{method:'POST'});waitRestart('되돌리는 중…')}catch(err){toast(err.message,true)}break;
    case 'quit':if(confirm('프로그램을 끌까요?')){await save();try{await api('/api/quit',{method:'POST'})}catch(err){}document.body.innerHTML='<div class="empty" style="padding:120px"><h3>실적관리를 껐어요</h3><p>다시 쓰려면 <b>실적관리 실행.bat</b>을 더블클릭하세요. 이 탭은 닫아도 돼요.</p></div>'}break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;const act=el.dataset&&el.dataset.act;if(!act)return;
  const k=el.dataset.k,f=el.dataset.f;
  const numVal=v=>{const s=String(v).replace(/[^\d]/g,'');return s===''?null:Number(s)};
  switch(act){
    case 'cfilter':classFilter=k;render();return;
  }
  if(!EDIT){render();return}
  switch(act){
    case 'clsSet':{const s=D.classes[k]||(D.classes[k]={level:'고1',struct:'2',exc:null,note:'',auto:true});
      if(f==='exc'){s.exc=numVal(el.value);const p=D.presets.find(p=>p.price===s.exc);if(p&&!s.note)s.note=p.label}else s[f]=el.value;
      s.auto=false;break;}
    case 'rateSet':D.rates[el.dataset.s][el.dataset.l]=numVal(el.value)||0;break;
    case 'presetSet':{const p=D.presets[Number(el.dataset.i)];if(f==='price')p.price=numVal(el.value)||0;else p.label=el.value;break;}
    case 'tSet':{const t=D.teachers.find(t=>t.id===el.dataset.id);if(f==='active')t.active=el.checked;else if(f==='order')t.order=numVal(el.value)||99;else t[f]=el.value.trim();break;}
    case 'branchSet':D.branch=el.value.trim()||'남천1관';break;
    case 'incToggle':{const m=D.months[MONTH];m.inc=m.inc||{};const keys=JSON.parse(el.dataset.keys);
      const calc=computeMonth(MONTH);
      for(const key of keys){const [sk,gk]=key.split('@');const r=calc.rows.find(r=>r.skey===gk);const x=r&&r.mem.find(x=>x.key===sk);
        if(x&&x.def===el.checked)delete m.inc[key];else m.inc[key]=el.checked}
      break;}
    default:return;
  }
  markDirty();
  const inModal=!!el.closest('.modal');
  if(inModal){const sk=act==='clsSet'?k:(JSON.parse(el.dataset.keys||'[""]')[0].split('@')[1]);render();openRow(sk);}
  else render();
});
$('#monthSel').addEventListener('change',e=>{MONTH=e.target.value;render()});
$('#fileIn').addEventListener('change',async e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)try{await fileImport(fs)}catch(err){toast(err.message,true)}});
window.addEventListener('beforeunload',e=>{if(dirty||saving){save();e.preventDefault();e.returnValue=''}});

/* ---------- 업데이트 · 공유 ---------- */
async function waitRestart(msg){
  loading(msg);await new Promise(r=>setTimeout(r,1500));
  for(let i=0;i<60;i++){try{await api('/api/ping');location.reload();return}catch(e){}await new Promise(r=>setTimeout(r,1000))}
  loading();toast('다시 켜지지 않았어요. 실적관리 실행.bat을 눌러 주세요.',true);
}
async function showVersion(){
  if(!SERVER)return;
  try{const v=await api('/api/version');APPV=v.version;$('#verChip').textContent='v'+v.version+' · ';
    if(v.note&&!v.note.seen)showModal(`v${v.note.to}(으)로 업데이트됐어요`,`<p class="muted" style="margin-top:0">${esc(v.note.at)} · v${esc(v.note.from)} → v${esc(v.note.to)}</p><ul>${(v.note.notes||[]).map(n=>`<li style="line-height:1.8">${esc(n)}</li>`).join('')}</ul>`);
  }catch(e){}
  try{const d=await api('/api/datadir');DATADIR=d;if(d.conflicts&&d.conflicts.length)toast('데이터 폴더에 충돌 파일이 있어요: '+d.conflicts.join(', ')+' — [설정]에서 확인',true)}catch(e){}
}
// 다른 PC에서 저장하면 자동으로 새로 불러오기
setInterval(async()=>{
  if(!SERVER||dirty||saving||!D||document.querySelector('.modal-bg'))return;
  try{const r=await api('/api/rev');if(r.rev!==D.rev){await load();render();toast('다른 컴퓨터에서 바뀐 내용을 불러왔어요')}}catch(e){}
},30000);

/* ---------- 시작 ---------- */
(async function(){
  try{await load()}catch(e){document.getElementById('main').innerHTML=`<div class="banner err">데이터를 불러오지 못했어요: ${esc(e.message)}</div>`;return}
  const live=Object.keys(D.months).filter(k=>D.months[k].kind==='live'&&!D.months[k].closed).sort().pop();
  MONTH=live||ymOf(new Date());
  render();
  showVersion();
})();
</script>
